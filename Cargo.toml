[package]
name = "intent_compiler"
version = "0.1.0"
edition = "2021"
description = "The Intent Compiler (ic): compile behavioral intent into programs with machine-checkable proof certificates"
license = "MIT"
authors = ["Intent Compiler contributors"]

# Zero external dependencies by design:
# a verifier must be self-contained and auditable. Everything —
# SHA-256, CLI parsing, the proof engines — is implemented here.
[dependencies]

[[bin]]
name = "ic"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1

# Integration tests invoke the real `ic` binary and enumerate millions of
# inputs; without optimization a single test run takes ~9 minutes. Tests
# exercise the same code — only faster.
[profile.test]
opt-level = 2
