[package]
name = "probatum"
version = "0.1.0"
edition = "2021"
description = "Write the contract, get the proof: compile behavioral intent into programs with machine-checkable proof certificates"
license = "MIT"
repository = "https://github.com/HyperonX-Team/probatum"
readme = "README.md"
keywords = ["formal-verification", "verification", "proof", "static-analysis", "compilers"]
categories = ["development-tools", "command-line-utilities", "compilers"]
authors = ["HyperonX-Team"]
include = [
    "src/**/*.rs",
    "examples/**/*.ic",
    "Cargo.toml",
    "README.md",
    "SPEC.md",
    "ARCHITECTURE.md",
    "ROADMAP.md",
    "LICENSE",
]

# Zero external dependencies by design:
# a verifier must be self-contained and auditable. Everything —
# SHA-256, CLI parsing, the proof engines — is implemented here.
[dependencies]

[[bin]]
name = "probatum"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1

# Integration tests invoke the real `probatum` binary and enumerate millions of
# inputs; without optimization a single test run takes ~9 minutes. Tests
# exercise the same code — only faster.
[profile.test]
opt-level = 2
